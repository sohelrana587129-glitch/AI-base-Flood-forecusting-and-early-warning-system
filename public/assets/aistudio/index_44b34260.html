<!DOCTYPE html>
<html>
<head>
    <title>Flood Risk Monitoring System</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
        }

        #controls{
            padding:10px;
            background:#f4f4f4;
        }

        #map{
            width:100%;
            height:90vh;
        }

        select{
            padding:8px;
        }
    </style>
</head>
<body>

<div id="controls">
    <label>Forecast Time:</label>

    <select id="hours">
        <option value="0">Current</option>
        <option value="6">+6 Hours</option>
        <option value="12">+12 Hours</option>
        <option value="24">+24 Hours</option>
    </select>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([24.89, 91.87], 14);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}).addTo(map);

let geojsonLayer;

function getColor(risk){

    if(risk === "High")
        return "#ff0000";

    if(risk === "Medium")
        return "#ffa500";

    if(risk === "Low")
        return "#00cc66";

    return "#0066ff";
}

function loadFloodMap(hours){

    fetch(`http://127.0.0.1:8000/api/v1/flood-risk-map?hours_ahead=${hours}`)
    .then(res => res.json())
    .then(data => {

        if(geojsonLayer){
            map.removeLayer(geojsonLayer);
        }

        geojsonLayer = L.geoJSON(data, {

            style: function(feature){

                return {
                    color: "#333",
                    weight: 1,
                    fillColor: getColor(
                        feature.properties.risk_level
                    ),
                    fillOpacity: 0.7
                };
            },

            pointToLayer: function(feature, latlng){

                return L.circleMarker(latlng,{
                    radius:10,
                    fillColor:"#0066ff",
                    color:"#fff",
                    weight:2,
                    fillOpacity:1
                });
            },

            onEachFeature: function(feature, layer){

                layer.bindPopup(`
                    <b>${feature.properties.name}</b><br>

                    Type:
                    ${feature.properties.type}<br>

                    Risk:
                    ${feature.properties.risk_level}<br>

                    ${feature.properties.description}
                `);
            }

        }).addTo(map);

    });
}

loadFloodMap("0");

document
.getElementById("hours")
.addEventListener("change", function(){

    loadFloodMap(this.value);

});

</script>

</body>
</html>
